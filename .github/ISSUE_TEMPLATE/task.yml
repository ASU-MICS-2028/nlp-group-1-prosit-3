name: Task
description: One unit of work, assigned to one person
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What will exist when this is finished, and why the project needs it.
    validations:
      required: true
  - type: dropdown
    id: slot
    attributes:
      label: Slot
      options: [setup, S0, M1, M2, M3, M4, M5, knowledge, section-a, report, slides, reading]
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Plan file
      description: docs/plans/<issue#>-<slug>.md, written by the start-task skill
      placeholder: to be written by the start-task skill
  - type: input
    id: blocked
    attributes:
      label: Blocked by
      placeholder: "none, or #N"
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checklist. Each item can be checked by running something.
      value: "- [ ] "
    validations:
      required: true
